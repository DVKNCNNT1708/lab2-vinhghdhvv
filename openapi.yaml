openapi: 3.1.0

info:
  title: Smart Campus — Lab 02 Contract Template
  version: 1.0.0
  description: |
    Hợp đồng API mẫu cho Lab 02.
    Sinh viên cần sửa lại title, description, path, schema và example theo cặp đàm phán thực tế.
  contact:
    name: FIT4110 Teaching Team
    email: fit4110@example.edu.vn

servers:
  - url: http://localhost:4010
    description: Prism mock server

  - url: https://api.campus.local
    description: Class network placeholder

tags:
  - name: health
    description: Kiểm tra trạng thái service

  - name: alerts
    description: Quản lý cảnh báo Smart Campus

  - name: events
    description: Quản lý sự kiện nghiệp vụ

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags:
        - health
      security: []

      responses:
        '200':
          description: Service đang hoạt động

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

              examples:
                ok:
                  value:
                    status: ok
                    service: lab02-contract-template
                    time: '2026-05-10T08:00:00Z'

  /alerts:
    post:
      operationId: createAlert

      summary: Tạo cảnh báo mới

      description: |
        Endpoint mẫu để Provider nhận yêu cầu tạo cảnh báo từ Consumer.
        Sinh viên cần sửa theo cặp đàm phán thực tế.

      tags:
        - alerts

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'

            examples:
              unauthorizedAccess:
                value:
                  sourceService: core-business
                  alertType: UNAUTHORIZED_ACCESS
                  severity: HIGH
                  message: Phát hiện truy cập trái phép tại cổng chính
                  relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

      responses:
        '201':
          description: Cảnh báo đã được tạo

          headers:
            Location:
              description: URI của alert vừa tạo.

              schema:
                type: string
                format: uri

          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

                  sourceService:
                    type: string

                  alertType:
                    type: string

                  severity:
                    type: string

                  message:
                    type: string

                  relatedEventId:
                    type:
                      - string
                      - 'null'

                    format: uuid

                  status:
                    type: string

                  createdAt:
                    type: string
                    format: date-time

                  resolvedAt:
                    type:
                      - string
                      - 'null'

                    format: date-time

              examples:
                created:
                  value:
                    id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    sourceService: core-business
                    alertType: UNAUTHORIZED_ACCESS
                    severity: HIGH
                    message: Phát hiện truy cập trái phép tại cổng chính
                    relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    status: OPEN
                    createdAt: '2026-05-10T08:00:00Z'
                    resolvedAt: null

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'

        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listAlerts

      summary: Lấy danh sách cảnh báo

      description: Lấy danh sách cảnh báo với cursor-based pagination.

      tags:
        - alerts

      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'

      responses:
        '200':
          description: Danh sách cảnh báo

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'

              examples:
                firstPage:
                  value:
                    items:
                      - sourceService: core-business
                        alertType: UNAUTHORIZED_ACCESS
                        severity: HIGH
                        message: Phát hiện truy cập trái phép tại cổng chính
                        relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

                    nextCursor: null
                    hasMore: false

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /alerts/recent:
    get:
      operationId: getRecentAlerts

      summary: Lấy các cảnh báo gần đây

      description: Endpoint mẫu cho cặp Analytics ↔ Core Business hoặc Frontend ↔ Core Business.

      tags:
        - alerts

      parameters:
        - name: limit
          in: query
          required: false

          description: Số cảnh báo tối đa cần lấy.

          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Danh sách cảnh báo gần đây

          content:
            application/json:
              schema:
                type: object
                additionalProperties: false

                required:
                  - items

                properties:
                  items:
                    type: array
                    minItems: 0
                    maxItems: 100

                    items:
                      $ref: '#/components/schemas/Alert'

              examples:
                recentAlerts:
                  value:
                    items: []

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /alerts/{alertId}:
    get:
      operationId: getAlertById

      summary: Lấy chi tiết một cảnh báo

      description: Lấy chi tiết alert theo UUID.

      tags:
        - alerts

      parameters:
        - $ref: '#/components/parameters/AlertId'

      responses:
        '200':
          description: Chi tiết cảnh báo

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AlertId:
      name: alertId
      in: path
      required: true

      description: UUID của cảnh báo.

      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false

      description: Cursor dùng để lấy trang tiếp theo.

      schema:
        type:
          - string
          - 'null'

        minLength: 1
        maxLength: 200

    Limit:
      name: limit
      in: query
      required: false

      description: Số item tối đa mỗi trang.

      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false

      required:
        - status
        - service
        - time

      properties:
        status:
          type: string
          enum:
            - ok

          example: ok

        service:
          type: string
          example: lab02-contract-template

        time:
          type: string
          format: date-time
          example: '2026-05-10T08:00:00Z'

    CreateAlertRequest:
      type: object
      additionalProperties: false

      required:
        - sourceService
        - alertType
        - severity
        - message

      properties:
        sourceService:
          type: string
          example: core-business

        alertType:
          type: string
          example: UNAUTHORIZED_ACCESS

        severity:
          type: string
          example: HIGH

        message:
          type: string
          example: Phát hiện truy cập trái phép tại cổng chính

        relatedEventId:
          type:
            - string
            - 'null'

          format: uuid
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

    Alert:
      type: object
      additionalProperties: false

      required:
        - id
        - sourceService
        - alertType
        - severity
        - message
        - status
        - createdAt

      properties:
        id:
          type: string
          format: uuid

        sourceService:
          type: string

        alertType:
          type: string

        severity:
          type: string

        message:
          type: string

        relatedEventId:
          type:
            - string
            - 'null'

          format: uuid

        status:
          type: string

        createdAt:
          type: string
          format: date-time

        resolvedAt:
          type:
            - string
            - 'null'

          format: date-time

    AlertPage:
      type: object
      additionalProperties: false

      required:
        - items
        - nextCursor
        - hasMore

      properties:
        items:
          type: array

          items:
            $ref: '#/components/schemas/CreateAlertRequest'

        nextCursor:
          type:
            - string
            - 'null'

          example: null

        hasMore:
          type: boolean
          example: false

    Problem:
      type: object
      additionalProperties: false

      required:
        - type
        - title
        - status

      properties:
        type:
          type: string
          format: uri
          example: https://campus.local/errors/validation

        title:
          type: string
          example: Dữ liệu không hợp lệ

        status:
          type: integer
          example: 400

        detail:
          type:
            - string
            - 'null'

          example: Payload không đúng JSON Schema

        instance:
          type:
            - string
            - 'null'

          format: uri

          example: https://api.campus.local/alerts

  responses:
    BadRequest:
      description: Dữ liệu sai định dạng

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

          example:
            type: https://campus.local/errors/validation
            title: Dữ liệu không hợp lệ
            status: 400
            detail: Payload không đúng JSON Schema
            instance: https://api.campus.local/alerts

    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

          example:
            type: https://campus.local/errors/unauthorized
            title: Chưa xác thực
            status: 401
            detail: Thiếu Bearer token
            instance: https://api.campus.local/alerts/recent

    Forbidden:
      description: Không có quyền thực hiện thao tác

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource không tồn tại

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Payload đúng định dạng nhưng không hợp lệ về nghiệp vụ

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: Lỗi không mong muốn phía server

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'